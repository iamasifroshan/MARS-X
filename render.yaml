services:
  - type: web
    name: mars-x-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: MARS-X
      - key: CORS_ORIGINS
        value: "https://mars-x-nasa.vercel.app,http://localhost:3005,http://127.0.0.1:3005,https://mars-x-backend.onrender.com,https://mars-x-cc6e.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: MARS_OPERATING_MODE
        value: "cloud_demo"
